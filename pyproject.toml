[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amit-sharma-neural-heart"
version = "1.0.3"
authors = [
  { name="Amit", email="amit@example.com" },
]
description = "A professional AI assistant with a Neural Heart and Long-Term Memory."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "openai",
    "python-dotenv",
    "duckduckgo-search",
    "requests",
    "beautifulsoup4",
    "rich"
]

[project.scripts]
amit = "amit_core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["amit_core*"]
