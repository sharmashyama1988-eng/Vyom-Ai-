<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyom AI | Neural Interface</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Markdown & Highlight -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>

    <style>
        :root {
            /* Core Palette */
            --bg-dark: #0f0f0f;
            --bg-sidebar: #161616;
            --bg-surface: #1e1e1e;
            --bg-input: #252525;
            
            /* Accents */
            --accent-primary: #6366f1; /* Indigo */
            --accent-glow: rgba(99, 102, 241, 0.4);
            --accent-secondary: #a855f7; /* Purple */
            
            /* Text */
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            
            /* Borders */
            --border-subtle: #333333;
            
            /* Spacing */
            --header-height: 60px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        /* --- Sidebar --- */
        #sidebar {
            width: 280px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-subtle);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 20;
        }

        .logo-area {
            height: var(--header-height);
            padding: 0 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.5px;
        }
        
        .logo-area i { color: var(--accent-primary); margin-right: 10px; font-size: 1.2rem; }
        .logo-text { background: linear-gradient(90deg, #fff, #94a3b8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

        .new-chat-btn {
            margin: 20px;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .new-chat-btn:hover { opacity: 0.9; }
        .new-chat-btn:active { transform: scale(0.98); }

        #history-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px;
        }
        
        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #444; }

        .history-item {
            padding: 12px 16px;
            margin-bottom: 4px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .history-item:hover { background-color: rgba(255,255,255,0.03); color: var(--text-main); }
        .history-item.active { background-color: rgba(99, 102, 241, 0.1); color: var(--accent-primary); border-left: 2px solid var(--accent-primary); }
        .history-item i { font-size: 0.8rem; opacity: 0.7; }

        .user-profile {
            padding: 15px 20px;
            border-top: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
        }
        .avatar { width: 32px; height: 32px; background: #333; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }

        /* --- Main Chat --- */
        #main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-dark);
            position: relative;
        }

        #chat-header {
            height: var(--header-height);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .model-selector-wrapper {
            position: relative;
            min-width: 180px;
        }

        #model-select {
            appearance: none;
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            padding: 8px 35px 8px 15px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            width: 100%;
            outline: none;
        }
        #model-select:focus { border-color: var(--accent-primary); }
        
        .selector-arrow {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        #chat-feed {
            flex: 1;
            overflow-y: auto;
            padding: 40px 0;
            scroll-behavior: smooth;
        }

        .message-row {
            display: flex;
            gap: 20px;
            max-width: 850px;
            margin: 0 auto;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }
        
        .message-row.user-row { flex-direction: row-reverse; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .msg-avatar {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .user-row .msg-avatar { background: var(--bg-surface); color: var(--text-muted); }
        .ai-row .msg-avatar { background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); color: white; box-shadow: 0 0 15px var(--accent-glow); }

        .msg-bubble {
            flex: 1;
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-main);
            overflow-x: auto;
        }
        .user-row .msg-bubble { 
            background-color: var(--bg-input); 
            padding: 12px 18px; 
            border-radius: 12px 0 12px 12px; 
            max-width: 70%;
            flex: unset;
        }
        
        /* Markdown Styles */
        .msg-bubble p { margin-bottom: 10px; }
        .msg-bubble p:last-child { margin-bottom: 0; }
        .msg-bubble pre { 
            background: #121212; 
            border: 1px solid #333; 
            border-radius: 8px; 
            padding: 12px; 
            overflow-x: auto; 
            margin: 15px 0;
            position: relative;
        }
        .msg-bubble code { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; }
        .msg-bubble strong { color: #fff; font-weight: 600; }
        .msg-bubble ul, .msg-bubble ol { margin-left: 20px; margin-bottom: 10px; }
        .msg-bubble blockquote { border-left: 3px solid var(--accent-primary); padding-left: 15px; color: var(--text-muted); font-style: italic; }

        /* Thinking Animation */
        .thinking-dots { display: flex; gap: 4px; padding: 10px 0; }
        .dot { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: pulse 1.4s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes pulse { 0%, 80%, 100% { transform: scale(0); opacity: 0.5; } 40% { transform: scale(1); opacity: 1; } }

        /* --- Input Area --- */
        #input-container {
            max-width: 850px;
            margin: 0 auto 30px auto;
            width: 100%;
            padding: 0 20px;
        }

        .input-box-wrapper {
            background-color: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 10px 15px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: border-color 0.2s;
        }
        .input-box-wrapper:focus-within { border-color: var(--accent-primary); }

        #chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            max-height: 200px;
            padding: 8px 0;
            min-height: 24px;
        }
        
        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
        }
        .icon-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
        
        #send-btn {
            color: var(--bg-dark);
            background: var(--text-main);
        }
        #send-btn:hover { opacity: 0.9; }
        #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* --- Toast Notification --- */
        #toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background-color: #ef4444;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 100;
        }
        #toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }

        .user-info { flex: 1; }
        .user-name { font-weight: 500; }
        .device-info { font-size: 0.75rem; color: #666; font-family: 'JetBrains Mono'; }
        .settings-icon { cursor: pointer; opacity: 0.5; }
        .header-left { display: flex; align-items: center; }
        .chat-title-text { font-weight: 500; color: var(--text-muted); font-size: 0.9rem; }
        .welcome-screen { text-align: center; margin-top: 20vh; opacity: 0.3; }
        .welcome-icon { font-size: 3rem; margin-bottom: 20px; }
        .input-footer { text-align: center; font-size: 0.7rem; color: #444; margin-top: 10px; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            #sidebar { position: fixed; height: 100%; transform: translateX(-100%); }
            #sidebar.open { transform: translateX(0); }
            .mobile-menu-btn { display: block !important; margin-right: 15px; }
        }
        .mobile-menu-btn { display: none; color: var(--text-main); font-size: 1.2rem; cursor: pointer; }

    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside id="sidebar">
        <div class="logo-area">
            <i class="fa-solid fa-cube"></i>
            <span class="logo-text">VYOM AI</span>
        </div>
        
        <button class="new-chat-btn" onclick="startNewChat()">
            <i class="fa-solid fa-plus"></i> New Session
        </button>
        
        <div id="history-list">
            <!-- Dynamic History Items -->
        </div>

        <div class="user-profile">
            <div class="avatar"><i class="fa-solid fa-user"></i></div>
            <div class="user-info">
                <div class="user-name">User</div>
                <div class="device-info">Device: <span id="did-display">...</span></div>
            </div>
            <i class="fa-solid fa-gear settings-icon" title="Settings"></i>
        </div>
    </aside>

    <!-- Main Chat -->
    <main id="main-area">
        <header id="chat-header">
            <div class="header-left">
                <div class="mobile-menu-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></div>
                <span class="chat-title-text" id="chat-title">New Session</span>
            </div>
            
            <div class="model-selector-wrapper">
                <select id="model-select" onchange="saveModelPref()" title="Select Neural Model" aria-label="Select Neural Model">
                    <!-- Options injected by JS -->
                </select>
                <i class="fa-solid fa-chevron-down selector-arrow"></i>
            </div>
        </header>

        <div id="chat-feed">
            <div class="welcome-screen">
                <i class="fa-solid fa-brain welcome-icon"></i>
                <p>Vyom Neural Interface Ready</p>

            </div>
        </div>

        <div id="input-container">
            <div class="input-box-wrapper">
                <button class="icon-btn" title="Upload (Not active in demo)"><i class="fa-solid fa-paperclip"></i></button>
                <textarea id="chat-input" rows="1" placeholder="Type a message..." oninput="autoResize(this)" onkeydown="handleEnter(event)" aria-label="Chat Input"></textarea>
                <button id="send-btn" class="icon-btn" onclick="sendMessage()" title="Send Message"><i class="fa-solid fa-arrow-up"></i></button>
            </div>
            <div class="input-footer">
                AI can make mistakes. Verify critical information.
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast">Error connecting to server</div>

    <script>
        // --- Configuration & Constants ---
        const API_BASE = window.location.origin;
        let currentChatId = null;
        let deviceId = localStorage.getItem('vyom_device_id');
        
        // --- White-Label Mapping ---
        const MODEL_MAP = {
            'gemini-2.5-flash': 'Vyom Flash v2.5',
            'gemini-2.0-flash': 'Vyom Flash v2.0',
            'gemini-2.5-pro': 'Vyom Pro v2.5',
            'gemini-pro': 'Vyom Prime',
            'gemini-flash': 'Vyom Bolt',
            'gemini-flash-latest': 'Vyom Bolt (Latest)',
            'realistic': 'Vyom Vision (Real)',
            'anime': 'Vyom Vision (Anime)'
        };

        const REVERSE_MODEL_MAP = {}; // To find backend ID from display name if needed, but we use values in select

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', async () => {
            initDeviceId();
            await fetchModels();
            await loadChats();
            
            // Auto-focus input
            document.getElementById('chat-input').focus();
        });

        function initDeviceId() {
            if (!deviceId) {
                deviceId = 'dev-' + Math.random().toString(36).substr(2, 9) + '-' + Date.now();
                localStorage.setItem('vyom_device_id', deviceId);
            }
            document.getElementById('did-display').textContent = deviceId.substr(0, 6);
        }

        // --- Network Functions ---

        async function fetchModels() {
            try {
                const res = await fetch(`${API_BASE}/models`);
                const models = await res.json();
                
                const select = document.getElementById('model-select');
                select.innerHTML = '';
                
                // Get saved preference
                const savedModel = localStorage.getItem('vyom_pref_model');

                models.forEach(modelId => {
                    const option = document.createElement('option');
                    option.value = modelId;
                    option.textContent = MODEL_MAP[modelId] || `Vyom Core (${modelId})`; // Fallback for unknown IDs
                    if (modelId === savedModel) option.selected = true;
                    select.appendChild(option);
                });

            } catch (e) {
                showToast("Failed to load neural models");
            }
        }

        async function loadChats() {
            try {
                const res = await fetch(`${API_BASE}/user/chats?device_id=${deviceId}`);
                const chats = await res.json();
                renderHistory(chats);
            } catch (e) {
                console.error("History load error", e);
            }
        }

        async function loadChatHistory(chatId) {
            currentChatId = chatId;
            // Highlight in sidebar
            document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.querySelector(`.history-item[onclick="loadChatHistory('${chatId}')"]`);
            if (activeItem) activeItem.classList.add('active');

            // Fetch messages
            try {
                // Determine which history endpoint to use. 
                // Based on standard implementation: /user/history usually returns flattened list or objects
                const res = await fetch(`${API_BASE}/user/history?device_id=${deviceId}&chat_id=${chatId}`);
                const data = await res.json();
                
                const feed = document.getElementById('chat-feed');
                feed.innerHTML = ''; // Clear welcome screen
                
                if (data.history && Array.isArray(data.history)) {
                    data.history.forEach(msgItem => {
                        // Handle both string "User: msg" format and object {role, content} format
                        let role = 'user';
                        let content = '';

                        if (typeof msgItem === 'string') {
                            if (msgItem.startsWith('User: ')) {
                                role = 'user';
                                content = msgItem.replace('User: ', '');
                            } else {
                                role = 'ai';
                                content = msgItem.replace('Vyom AI: ', '');
                            }
                        } else {
                            role = msgItem.role === 'user' ? 'user' : 'ai';
                            content = msgItem.content;
                        }
                        appendMessage(role, content, false);
                    });
                }
                scrollToBottom();
            } catch (e) {
                showToast("Could not retrieve memory logs");
            }
        }

        async function startNewChat() {
            try {
                const res = await fetch(`${API_BASE}/user/new_chat`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ device_id: deviceId })
                });
                const chat = await res.json();
                currentChatId = chat.id;
                
                // Clear feed and reload sidebar
                document.getElementById('chat-feed').innerHTML = '';
                document.getElementById('chat-title').textContent = "New Session";
                await loadChats();
                
                // Select the new chat
                loadChatHistory(currentChatId);
                
            } catch (e) {
                showToast("Failed to initialize new session");
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;

            // UI Updates
            input.value = '';
            input.style.height = 'auto'; // Reset height
            appendMessage('user', message);
            
            // ensure chat ID exists
            if (!currentChatId) await startNewChat();

            // Show Loading
            const loadingId = showLoading();
            scrollToBottom();

            // Prepare Payload
            const selectedModel = document.getElementById('model-select').value;
            const payload = {
                message: message,
                device_id: deviceId,
                chat_id: currentChatId,
                settings: {
                    model: selectedModel
                }
            };

            try {
                const res = await fetch(`${API_BASE}/ask`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error("Server error");
                
                const data = await res.json();
                
                // Remove loading
                document.getElementById(loadingId).remove();
                
                // Show Answer
                appendMessage('ai', data.answer);
                
                // Refresh history list title if it's the first message
                loadChats();

            } catch (e) {
                document.getElementById(loadingId).remove();
                showToast("Connection to Neural Core Lost");
                appendMessage('ai', "_Error: Signal interrupted. Please retry._");
            }
        }

        // --- UI Rendering ---

        function renderHistory(chats) {
            const list = document.getElementById('history-list');
            list.innerHTML = '';
            
            // Sort by new
            chats.reverse(); 

            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = 'history-item';
                if (chat.id === currentChatId) item.classList.add('active');
                
                // Clean title logic
                let title = chat.title || chat.id.substr(0, 8);
                if (title.length > 25) title = title.substr(0, 25) + '...';
                
                item.innerHTML = `<i class="fa-regular fa-message"></i> ${title}`;
                item.onclick = () => loadChatHistory(chat.id);
                list.appendChild(item);
            });
        }

        function appendMessage(role, text, animate = true) {
            const feed = document.getElementById('chat-feed');
            
            const row = document.createElement('div');
            row.className = `message-row ${role === 'user' ? 'user-row' : 'ai-row'}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.innerHTML = role === 'user' ? '<i class="fa-solid fa-user"></i>' : '<i class="fa-solid fa-bolt"></i>';
            
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            
            if (role === 'ai') {
                // Markdown Parsing
                bubble.innerHTML = marked.parse(text);
                // Syntax Highlight
                bubble.querySelectorAll('pre code').forEach((block) => {
                    hljs.highlightElement(block);
                });
            } else {
                bubble.textContent = text;
            }

            if (role === 'user') {
                row.appendChild(bubble); // Avatar is not usually shown for user in modern UIs or shown on right
                // But my CSS `user-row` has `flex-direction: row-reverse`.
                // So append Avatar then Bubble, and CSS swaps them visually.
                row.appendChild(avatar); 
            } else {
                row.appendChild(avatar);
                row.appendChild(bubble);
            }

            feed.appendChild(row);
            scrollToBottom();
        }

        function showLoading() {
            const feed = document.getElementById('chat-feed');
            const id = 'loading-' + Date.now();
            
            const row = document.createElement('div');
            row.id = id;
            row.className = 'message-row ai-row';
            
            const avatar = document.createElement('div');
            avatar.className = 'msg-avatar';
            avatar.innerHTML = '<i class="fa-solid fa-bolt"></i>';
            
            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';
            bubble.innerHTML = `<div class="thinking-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
            
            row.appendChild(avatar);
            row.appendChild(bubble);
            feed.appendChild(row);
            return id;
        }

        // --- Utilities ---

        function scrollToBottom() {
            const feed = document.getElementById('chat-feed');
            setTimeout(() => {
                feed.scrollTop = feed.scrollHeight;
            }, 50);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('visible');
            setTimeout(() => toast.classList.remove('visible'), 3000);
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function saveModelPref() {
            const val = document.getElementById('model-select').value;
            localStorage.setItem('vyom_pref_model', val);
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // Markdown Configuration
        marked.setOptions({
            breaks: true, // Enable line breaks
            gfm: true // Github Flavored Markdown
        });

    </script>
</body>
</html>
