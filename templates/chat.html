<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyom AI - Advanced Neural Interface</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Markdown & Code Highlighting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>

    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            
            --bg-dark: #0a0e27;
            --bg-darker: #050811;
            --bg-card: #1a1f3a;
            --bg-input: #151b2e;
            
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            
            --border-color: #334155;
            --border-light: #475569;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--bg-darker) 0%, var(--bg-dark) 100%);
            color: var(--text-primary);
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
            gap: 0;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 320px;
            background: rgba(26, 31, 58, 0.8);
            -webkit-backdrop-filter: blur(10px);
            backdrop-filter: blur(10px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .sidebar-header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0;
            background: linear-gradient(90deg, #fff, #cbd5e1);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .new-chat-btn {
            margin: 16px;
            padding: 12px 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .new-chat-btn:active {
            transform: translateY(0);
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .chat-item {
            padding: 12px 16px;
            margin-bottom: 6px;
            background: rgba(71, 85, 105, 0.1);
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
            color: var(--text-primary);
        }

        .chat-item.active {
            background: rgba(99, 102, 241, 0.25);
            border-color: var(--primary);
            color: var(--primary);
        }

        .chat-item i {
            flex-shrink: 0;
            opacity: 0.7;
        }

        /* Scrollbar Styling */
        .chats-list::-webkit-scrollbar {
            width: 6px;
        }

        .chats-list::-webkit-scrollbar-track {
            background: transparent;
        }

        .chats-list::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        .chats-list::-webkit-scrollbar-thumb:hover {
            background: var(--border-light);
        }

        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9rem;
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-device {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: 'Fira Code', monospace;
        }

        /* ===== MAIN AREA ===== */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-dark);
        }

        .header {
            height: 70px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            gap: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            min-width: 0;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            font-size: 1.3rem;
            cursor: pointer;
        }

        .back-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
        }

        .back-btn.hidden {
            display: none;
        }

        .chat-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .model-selector {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 200px;
        }

        .model-selector:hover {
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
        }

        .model-selector:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        /* ===== CHAT FEED ===== */
        .chat-feed {
            flex: 1;
            overflow-y: auto;
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chat-feed::-webkit-scrollbar {
            width: 8px;
        }

        .chat-feed::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-feed::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .chat-feed::-webkit-scrollbar-thumb:hover {
            background: var(--border-light);
        }

        .message-group {
            display: flex;
            gap: 16px;
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-group.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1.1rem;
        }

        .message-avatar.user {
            background: rgba(99, 102, 241, 0.2);
            color: var(--primary);
        }

        .message-avatar.ai {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }

        .message-bubble {
            flex: 1;
            padding: 16px 20px;
            border-radius: 12px;
            line-height: 1.6;
            word-wrap: break-word;
            overflow-x: auto;
        }

        .message-bubble.user {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            max-width: 70%;
            margin-left: auto;
        }

        .message-bubble.ai {
            background: rgba(99, 102, 241, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
        }

        /* Markdown Styles */
        .message-bubble h1, .message-bubble h2, .message-bubble h3 {
            margin-top: 16px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .message-bubble h1 { font-size: 1.4rem; color: var(--primary); }
        .message-bubble h2 { font-size: 1.2rem; color: var(--primary); }
        .message-bubble h3 { font-size: 1.1rem; }

        .message-bubble p {
            margin-bottom: 12px;
        }

        .message-bubble p:last-child {
            margin-bottom: 0;
        }

        .message-bubble ul, .message-bubble ol {
            margin-left: 20px;
            margin-bottom: 12px;
        }

        .message-bubble li {
            margin-bottom: 6px;
        }

        .message-bubble code {
            background: var(--bg-input);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Fira Code', monospace;
            font-size: 0.9em;
            color: var(--primary);
        }

        .message-bubble pre {
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin: 12px 0;
            overflow-x: auto;
            position: relative;
        }

        .message-bubble pre code {
            background: none;
            padding: 0;
            color: inherit;
        }

        .copy-code-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--primary);
            border: none;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .message-bubble pre:hover .copy-code-btn {
            opacity: 1;
        }

        .copy-code-btn:hover {
            background: var(--primary-dark);
        }

        .message-bubble blockquote {
            border-left: 3px solid var(--primary);
            padding-left: 12px;
            color: var(--text-muted);
            font-style: italic;
            margin: 12px 0;
        }

        .message-bubble strong {
            color: var(--primary);
            font-weight: 600;
        }

        .message-bubble a {
            color: var(--primary);
            text-decoration: none;
            border-bottom: 1px dotted var(--primary);
        }

        .message-bubble a:hover {
            text-decoration: underline;
        }

        /* Loading Animation */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--primary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        .welcome-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            padding: 40px 20px;
            background: var(--bg-dark);
        }

        .welcome-content {
            text-align: center;
            max-width: 500px;
        }

        .welcome-icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        .welcome-text {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .welcome-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 40px;
        }

        .quick-prompts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            max-width: 700px;
            margin-top: 30px;
        }

        .prompt-card {
            background: rgba(99, 102, 241, 0.08);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .prompt-card:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .prompt-title {
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        .prompt-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* ===== INPUT AREA ===== */
        .input-area {
            padding: 20px;
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-box {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            transition: all 0.2s ease;
        }

        .input-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        #chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            resize: none;
            min-height: 24px;
            max-height: 200px;
            outline: none;
        }

        #chat-input::placeholder {
            color: var(--text-muted);
        }

        .input-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            color: var(--text-primary);
            background: rgba(99, 102, 241, 0.1);
        }

        #send-btn {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        #send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        #send-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-hint {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(150px);
            background: var(--danger);
            color: white;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            z-index: 999;
            transition: transform 0.3s ease;
        }

        .toast.visible {
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: var(--success);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100%;
                z-index: 100;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .menu-toggle {
                display: block;
            }

            .message-bubble.user {
                max-width: 85%;
            }

            .header {
                padding: 0 16px;
            }

            .input-area {
                padding: 12px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">V</div>
                <h1>Vyom AI</h1>
            </div>

            <button class="new-chat-btn" onclick="startNewChat()">
                <i class="fas fa-plus"></i> New Chat
            </button>

            <div class="chats-list" id="chats-list">
                <!-- Chat items populated here -->
            </div>

            <div class="sidebar-footer">
                <div class="user-avatar" id="user-avatar">U</div>
                <div class="user-info">
                    <div class="user-name">User</div>
                    <div class="user-device" id="device-id">dev-...</div>
                </div>
                <button class="icon-btn" title="Settings" onclick="alert('Settings coming soon')">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </aside>

        <!-- Main Area -->
        <div class="main-area">
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <button class="menu-toggle" onclick="toggleSidebar()">
                        <i class="fas fa-bars"></i>
                    </button>
                    <button class="back-btn hidden" id="back-btn" onclick="goToNewChat()" title="Back to chat">
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    <div class="chat-title" id="chat-title">Vyom AI</div>
                </div>

                <select class="model-selector" id="model-select" onchange="saveModelPref()" title="Select AI Model">
                    <!-- Options populated here -->
                </select>
            </header>

            <!-- Chat Feed -->
            <div class="chat-feed" id="chat-feed">
                <div class="welcome-screen">
                    <div class="welcome-content">
                        <div class="welcome-icon"></div>
                        <div class="welcome-text">Vyom AI</div>
                        <p class="welcome-subtitle">Your Advanced Neural Assistant</p>
                    </div>

                    <div class="quick-prompts">
                        <div class="prompt-card" onclick="insertPrompt('Explain quantum computing in simple terms')">
                            <div class="prompt-title">💡 Explain</div>
                            <div class="prompt-desc">Complex topics simplified</div>
                        </div>
                        <div class="prompt-card" onclick="insertPrompt('Write a Python script that...')">
                            <div class="prompt-title">💻 Code</div>
                            <div class="prompt-desc">Generate code snippets</div>
                        </div>
                        <div class="prompt-card" onclick="insertPrompt('Create a detailed plan for...')">
                            <div class="prompt-title">📋 Plan</div>
                            <div class="prompt-desc">Organize your ideas</div>
                        </div>
                        <div class="prompt-card" onclick="insertPrompt('Analyze and summarize: ')">
                            <div class="prompt-title">📊 Analyze</div>
                            <div class="prompt-desc">Deep dive into topics</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-wrapper">
                    <div class="input-box">
                        <button class="icon-btn" title="Attach file (coming soon)">
                            <i class="fas fa-paperclip"></i>
                        </button>
                        <textarea id="chat-input" placeholder="Type your message..." rows="1" oninput="autoResize(this)" onkeydown="handleEnter(event)"></textarea>
                        <div class="input-actions">
                            <button class="icon-btn" title="Clear" onclick="clearInput()">
                                <i class="fas fa-times"></i>
                            </button>
                            <button id="send-btn" onclick="sendMessage()" title="Send message">
                                <i class="fas fa-paper-plane"></i> Send
                            </button>
                        </div>
                    </div>
                    <div class="input-hint">AI can make mistakes. Always verify important information.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // ===== CONFIGURATION =====
        const API_BASE = window.location.origin;
        let currentChatId = null;
        let deviceId = localStorage.getItem('vyom_device_id');

        const MODEL_MAP = {
            'gemini-1.5-flash': 'Vyom Flash v1.5',
            'gemini-1.5-flash-8b': 'Vyom Turbo (8B)',
            'gemini-1.5-pro': 'Vyom Pro v1.5',
            'gemini-1.0-pro': 'Vyom Prime',
            'gemini-1.5-pro-latest': 'Vyom Pro (Latest)',
            'realistic': 'Vyom Vision Real',
            'anime': 'Vyom Vision Anime'
        };

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', async () => {
            initDeviceId();
            await fetchModels();
            await loadChats();
            document.getElementById('chat-input').focus();
        });

        function initDeviceId() {
            if (!deviceId) {
                deviceId = 'dev-' + Math.random().toString(36).substr(2, 9) + '-' + Date.now();
                localStorage.setItem('vyom_device_id', deviceId);
            }
            document.getElementById('device-id').textContent = deviceId.substr(0, 12);
        }

        // ===== API FUNCTIONS =====
        async function fetchModels() {
            try {
                const res = await fetch(`${API_BASE}/models`);
                const models = await res.json();
                const select = document.getElementById('model-select');
                select.innerHTML = '';

                const savedModel = localStorage.getItem('vyom_pref_model');
                models.forEach(modelId => {
                    const option = document.createElement('option');
                    option.value = modelId;
                    option.textContent = MODEL_MAP[modelId] || `Vyom (${modelId})`;
                    if (modelId === savedModel) option.selected = true;
                    select.appendChild(option);
                });
            } catch (e) {
                showToast('Failed to load neural models', 'error');
            }
        }

        async function loadChats() {
            try {
                const res = await fetch(`${API_BASE}/user/chats?device_id=${deviceId}`);
                const chats = await res.json();
                renderChats(chats);
            } catch (e) {
                console.error('Failed to load chats', e);
            }
        }

        async function loadChatHistory(chatId) {
            currentChatId = chatId;
            document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
            const activeItem = document.querySelector(`.chat-item[onclick="loadChatHistory('${chatId}')"]`);
            if (activeItem) activeItem.classList.add('active');
            
            // Show back button when viewing history
            document.getElementById('back-btn').classList.remove('hidden');
            document.getElementById('chat-title').textContent = 'Chat History';

            try {
                const res = await fetch(`${API_BASE}/user/history?device_id=${deviceId}&chat_id=${chatId}`);
                const data = await res.json();
                const feed = document.getElementById('chat-feed');
                feed.innerHTML = '';

                if (data.history && Array.isArray(data.history)) {
                    data.history.forEach(msg => {
                        let role = 'user';
                        let content = '';

                        if (typeof msg === 'string') {
                            if (msg.startsWith('User: ')) {
                                role = 'user';
                                content = msg.replace('User: ', '');
                            } else {
                                role = 'ai';
                                content = msg.replace('Vyom AI: ', '');
                            }
                        } else {
                            role = msg.role === 'user' ? 'user' : 'ai';
                            content = msg.content;
                        }
                        addMessage(role, content, false);
                    });
                }
                scrollToBottom();
            } catch (e) {
                showToast('Failed to load chat history', 'error');
            }
        }

        async function startNewChat() {
            try {
                const res = await fetch(`${API_BASE}/user/new_chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ device_id: deviceId })
                });
                const chat = await res.json();
                currentChatId = chat.id;

                document.getElementById('chat-feed').innerHTML = '';
                document.getElementById('chat-title').textContent = 'New Chat';
                await loadChats();
                loadChatHistory(currentChatId);
                closeSidebar();
            } catch (e) {
                showToast('Failed to create new chat', 'error');
            }
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message) return;

            input.value = '';
            input.style.height = 'auto';
            addMessage('user', message);

            if (!currentChatId) await startNewChat();

            const loadingId = showLoading();
            scrollToBottom();

            const selectedModel = document.getElementById('model-select').value;
            const payload = {
                message: message,
                device_id: deviceId,
                chat_id: currentChatId,
                settings: { model: selectedModel }
            };

            try {
                const res = await fetch(`${API_BASE}/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!res.ok) throw new Error('Server error');
                const data = await res.json();

                document.getElementById(loadingId).remove();
                addMessage('ai', data.answer);
                loadChats();
            } catch (e) {
                document.getElementById(loadingId).remove();
                showToast('Connection lost. Please try again.', 'error');
                addMessage('ai', '❌ Error: Connection interrupted. Please retry.');
            }
        }

        // ===== UI RENDERING =====
        function renderChats(chats) {
            const list = document.getElementById('chats-list');
            list.innerHTML = '';
            chats.reverse();

            chats.forEach(chat => {
                const item = document.createElement('div');
                item.className = 'chat-item';
                if (chat.id === currentChatId) item.classList.add('active');

                let title = chat.title || chat.id.substr(0, 8);
                if (title.length > 30) title = title.substr(0, 30) + '...';

                item.innerHTML = `<i class="fas fa-message"></i><span>${title}</span>`;
                item.onclick = () => loadChatHistory(chat.id);
                list.appendChild(item);
            });
        }

        function addMessage(role, content, animate = true) {
            const feed = document.getElementById('chat-feed');

            const group = document.createElement('div');
            group.className = `message-group ${role === 'user' ? 'user' : ''}`;

            const avatar = document.createElement('div');
            avatar.className = `message-avatar ${role === 'user' ? 'user' : 'ai'}`;
            avatar.innerHTML = role === 'user' ? '<i class="fas fa-user"></i>' : '<i class="fas fa-zap"></i>';

            const bubble = document.createElement('div');
            bubble.className = `message-bubble ${role === 'user' ? 'user' : 'ai'}`;

            if (role === 'ai') {
                bubble.innerHTML = marked.parse(content);
                bubble.querySelectorAll('pre').forEach((pre) => {
                    const code = pre.querySelector('code');
                    if (code) {
                        hljs.highlightElement(code);
                        const btn = document.createElement('button');
                        btn.className = 'copy-code-btn';
                        btn.innerHTML = '<i class="fas fa-copy"></i> Copy';
                        btn.onclick = () => {
                            navigator.clipboard.writeText(code.textContent);
                            showToast('Code copied!', 'success');
                        };
                        pre.appendChild(btn);
                    }
                });
            } else {
                bubble.textContent = content;
            }

            group.appendChild(avatar);
            group.appendChild(bubble);
            feed.appendChild(group);
            scrollToBottom();
        }

        function showLoading() {
            const feed = document.getElementById('chat-feed');
            const id = 'loading-' + Date.now();

            const group = document.createElement('div');
            group.id = id;
            group.className = 'message-group';

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar ai';
            avatar.innerHTML = '<i class="fas fa-zap"></i>';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble ai';
            bubble.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';

            group.appendChild(avatar);
            group.appendChild(bubble);
            feed.appendChild(group);
            return id;
        }

        // ===== UTILITIES =====
        function scrollToBottom() {
            const feed = document.getElementById('chat-feed');
            setTimeout(() => {
                feed.scrollTop = feed.scrollHeight;
            }, 50);
        }

        function showToast(msg, type = 'error') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast visible ${type}`;
            setTimeout(() => toast.classList.remove('visible'), 3000);
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 200) + 'px';
        }

        function handleEnter(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function saveModelPref() {
            const val = document.getElementById('model-select').value;
            localStorage.setItem('vyom_pref_model', val);
        }

        function clearInput() {
            document.getElementById('chat-input').value = '';
            document.getElementById('chat-input').style.height = 'auto';
        }

        function goToNewChat() {
            currentChatId = null;
            document.getElementById('chat-title').textContent = 'Vyom AI';
            document.getElementById('back-btn').classList.add('hidden');
            document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
            
            const feed = document.getElementById('chat-feed');
            feed.innerHTML = `
                <div class="welcome-screen">
                    <div class="welcome-content">
                        <div class="welcome-icon">🧠</div>
                        <div class="welcome-text">Vyom AI</div>
                        <p class="welcome-subtitle">Your Advanced Neural Assistant</p>
                    </div>

                    <div class="quick-prompts">
                        <div class="prompt-card" onclick="insertPrompt('Explain quantum computing in simple terms')">
                            <div class="prompt-title">💡 Explain</div>
                            <div class="prompt-desc">Complex topics simplified</div>
                        </div>
                        <div class="prompt-card" onclick="insertPrompt('Write a Python script that...')">
                            <div class="prompt-title">💻 Code</div>
                            <div class="prompt-desc">Generate code snippets</div>
                        </div>
                        <div class="prompt-card" onclick="insertPrompt('Create a detailed plan for...')">
                            <div class="prompt-title">📋 Plan</div>
                            <div class="prompt-desc">Organize your ideas</div>
                        </div>
                        <div class="prompt-card" onclick="insertPrompt('Analyze and summarize: ')">
                            <div class="prompt-title">📊 Analyze</div>
                            <div class="prompt-desc">Deep dive into topics</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function insertPrompt(text) {
            document.getElementById('chat-input').value = text;
            document.getElementById('chat-input').focus();
            autoResize(document.getElementById('chat-input'));
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
        }

        // Markdown Config
        marked.setOptions({ breaks: true, gfm: true });
    </script>

</body>
</html>
